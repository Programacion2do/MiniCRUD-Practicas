<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guía de entrega — Base de Datos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#191a23;--panel:#22232f;--panel-2:#262838;--border:#34364a;
  --text:#e7e7ee;--muted:#9497ab;
  --amber:#f2a154;--amber-soft:rgba(242,161,84,.12);
  --green:#7bd88f;--green-soft:rgba(123,216,143,.12);
  --blue:#7aa2f7;--blue-soft:rgba(122,162,247,.12);
  --red:#f7768e;--red-soft:rgba(247,118,142,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
 
.header{padding:36px 40px 20px;max-width:720px;margin:0 auto;width:100%;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:12px;}
.eyebrow::before{content:'● ';}
h1{font-family:'JetBrains Mono',monospace;font-size:clamp(18px,3.5vw,26px);font-weight:800;line-height:1.2;margin-bottom:8px;}
h1 span{color:var(--amber);}
.subtitle{color:var(--muted);font-size:13.5px;max-width:540px;line-height:1.6;}
 
/* ── Pestañas ── */
.tabs-wrap{max-width:720px;margin:0 auto;padding:0 40px 24px;width:100%;}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tab-btn{
  display:flex;align-items:center;gap:8px;
  background:var(--panel-2);border:1.5px solid var(--border);
  border-radius:10px;padding:10px 14px;cursor:pointer;
  font-family:'Inter',sans-serif;text-align:left;
  transition:all .2s;min-width:0;width:100%;
}
.tab-btn:hover{border-color:rgba(242,161,84,.4);}
.tab-btn.active{border-color:var(--amber);background:var(--amber-soft);}
.tab-num{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  color:var(--muted);background:var(--panel);border:1px solid var(--border);
  border-radius:6px;padding:2px 7px;flex-shrink:0;transition:all .2s;}
.tab-btn.active .tab-num{color:var(--amber);border-color:rgba(242,161,84,.4);background:var(--amber-soft);}
.tab-info{display:flex;flex-direction:column;gap:3px;min-width:0;}
.tab-title{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.3;transition:color .2s;}
.tab-btn.active .tab-title{color:var(--text);}
.tab-level{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;align-self:flex-start;}
.tab-level.basico{background:var(--green-soft);color:var(--green);border:1px solid rgba(123,216,143,.3);}
.tab-level.intermedio{background:var(--blue-soft);color:var(--blue);border:1px solid rgba(122,162,247,.3);}
.tab-level.avanzado{background:var(--red-soft);color:var(--red);border:1px solid rgba(247,118,142,.3);}
 
.progress-wrap{max-width:720px;margin:0 auto;padding:0 40px 20px;width:100%;}
.progress-dots{display:flex;align-items:center;gap:6px;}
.dot-step{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--muted);transition:all .25s;flex-shrink:0;}
.dot-step.done{background:var(--amber-soft);border-color:rgba(242,161,84,.5);color:var(--amber);}
.dot-step.active{background:var(--amber);border-color:var(--amber);color:#191a23;}
.dot-sep{flex:1;height:2px;background:var(--border);border-radius:2px;min-width:6px;}
.dot-sep.done{background:rgba(242,161,84,.4);}
.progress-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:10px;}
.progress-label span{color:var(--amber);}
 
.step-area{max-width:720px;margin:0 auto;padding:0 40px;width:100%;flex:1;}
 
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px 28px 24px;}
.card h2{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;margin-bottom:14px;}
.card p{font-size:13.5px;color:var(--muted);line-height:1.75;margin-bottom:10px;}
.card p:last-child{margin-bottom:0;}
.card p strong{color:var(--text);}
code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:4px;color:var(--amber);}
 
.step-badge{display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;}
.step-badge-num{width:44px;height:44px;border-radius:50%;background:var(--amber-soft);border:1.5px solid rgba(242,161,84,.5);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--amber);}
.step-badge-title{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:800;}
.step-badge-title span{color:var(--amber);}
 
.substeps{list-style:none;padding:0;margin:12px 0;}
.substeps li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(52,54,74,.4);font-size:13.5px;color:var(--muted);line-height:1.65;}
.substeps li:last-child{border-bottom:none;}
.substeps li strong{color:var(--text);}
.substep-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--amber-soft);border:1px solid rgba(242,161,84,.3);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:var(--amber);margin-top:2px;}
 
.file-list{margin:12px 0;display:flex;flex-direction:column;gap:6px;}
.file-row{display:flex;align-items:baseline;gap:8px;padding:7px 12px;background:var(--panel-2);border-radius:6px;border:1px solid var(--border);}
.file-badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:4px;flex-shrink:0;}
.file-badge.modificar{background:var(--amber-soft);color:var(--amber);border:1px solid rgba(242,161,84,.3);}
.file-badge.crear{background:rgba(123,216,143,.15);color:var(--green);border:1px solid rgba(123,216,143,.3);}
.file-path{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);}
.file-path span{color:var(--text);font-weight:600;}
 
.term{background:#14151d;border:1px solid var(--border);border-radius:8px;margin:12px 0;overflow:hidden;}
.term-bar{background:var(--panel-2);border-bottom:1px solid var(--border);padding:7px 12px;display:flex;gap:6px;align-items:center;}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.term-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-left:6px;}
.term-body{padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.85;color:var(--green);white-space:pre-wrap;}
.term-body .c{color:var(--muted);}
.term-body .a{color:var(--amber);}
.term-body .b{color:var(--blue);}
 
.tip{background:var(--green-soft);border:1px solid rgba(123,216,143,.3);border-radius:10px;padding:13px 17px;margin:12px 0;font-size:13px;color:var(--text);line-height:1.65;}
.tip-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--green);letter-spacing:.06em;margin-bottom:5px;}
.tip-lbl::before{content:'💡 ';}
.alerta{background:var(--amber-soft);border:1px solid rgba(242,161,84,.35);border-radius:10px;padding:13px 17px;margin:12px 0;font-size:13px;color:var(--text);line-height:1.65;}
.alerta-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--amber);letter-spacing:.06em;margin-bottom:5px;}
.alerta-lbl::before{content:'⚠ ';}
 
.preguntas{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:8px;}
.preguntas li{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;background:var(--panel-2);border-radius:8px;border:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.6;}
.preguntas li::before{content:'?';flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--blue-soft);border:1px solid rgba(122,162,247,.3);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--blue);margin-top:1px;}
 
.cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.cap-card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:13px 15px;}
.cap-icon{font-size:22px;margin-bottom:7px;}
.cap-title{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--amber);margin-bottom:5px;}
.cap-desc{font-size:12.5px;color:var(--muted);line-height:1.55;}
 
.tabla{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
.tabla th{text-align:left;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border);}
.tabla td{padding:9px 12px;border-bottom:1px solid rgba(52,54,74,.5);color:var(--text);}
.tabla td:first-child{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);}
 
.crea-box{background:var(--panel-2);border:1.5px solid rgba(122,162,247,.35);border-radius:10px;padding:14px 18px;margin:12px 0;display:flex;align-items:flex-start;gap:14px;}
.crea-icon{font-size:24px;flex-shrink:0;margin-top:2px;}
.crea-info{}
.crea-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--blue);letter-spacing:.06em;margin-bottom:4px;}
.crea-task{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--text);}
 
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding:20px 0 40px;}
.btn{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;padding:11px 22px;border-radius:8px;border:none;cursor:pointer;transition:all .2s;letter-spacing:.03em;}
.btn-prev{background:var(--panel-2);border:1.5px solid var(--border);color:var(--muted);}
.btn-prev:hover{border-color:var(--amber);color:var(--amber);}
.btn-next{background:var(--amber);color:#191a23;}
.btn-next:hover{background:#f5b374;transform:translateX(2px);}
.btn-finish{background:var(--green);color:#191a23;}
.btn-finish:hover{background:#9de8ab;}
.btn[hidden]{display:none;}
 
.complete-card{text-align:center;padding:40px 28px;}
.complete-icon{font-size:52px;margin-bottom:20px;}
.complete-card h2{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;margin-bottom:12px;}
.complete-card h2 span{color:var(--green);}
.complete-card p{color:var(--muted);font-size:14px;max-width:460px;margin:0 auto;}
.btn-restart{margin-top:24px;background:var(--panel-2);border:1.5px solid var(--border);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 18px;border-radius:8px;cursor:pointer;transition:all .2s;}
.btn-restart:hover{border-color:var(--amber);color:var(--amber);}
 
.step-panel{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
 
.footer{max-width:720px;margin:0 auto;padding:16px 40px 24px;border-top:1px solid var(--border);text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);line-height:1.7;width:100%;}
 
@media(max-width:600px){
  .header,.tabs-wrap,.progress-wrap,.step-area{padding-left:20px;padding-right:20px;}
  .cap-grid{grid-template-columns:1fr;}
  .tabs{grid-template-columns:1fr;}
}
</style>
</head>
<body>
 
<div class="header">
  <div class="eyebrow">Programación Avanzada · UTU · Bachillerato Tecnológico</div>
  <h1>Guía de entrega — <span>Base de Datos</span></h1>
  <p class="subtitle">Seleccionar la actividad a entregar, luego seguir los pasos.</p>
</div>
 
<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab-btn active" onclick="cambiarActividad(0)">
      <div class="tab-num">01</div>
      <div class="tab-info">
        <span class="tab-title">Mostrar fecha de nacimiento</span>
        <span class="tab-level basico">Básico</span>
      </div>
    </button>
    <button class="tab-btn" onclick="cambiarActividad(1)">
      <div class="tab-num">02</div>
      <div class="tab-info">
        <span class="tab-title">Búsqueda por nombre</span>
        <span class="tab-level intermedio">Intermedio</span>
      </div>
    </button>
    <button class="tab-btn" onclick="cambiarActividad(2)">
      <div class="tab-num">03</div>
      <div class="tab-info">
        <span class="tab-title">Tu entidad en MySQL</span>
        <span class="tab-level avanzado">Avanzado</span>
      </div>
    </button>
  </div>
</div>
 
<div class="progress-wrap">
  <div class="progress-dots" id="progressDots"></div>
  <div class="progress-label" id="progressLabel"></div>
</div>
 
<div class="step-area">
  <div id="stepContainer"></div>
  <div class="nav">
    <button class="btn btn-prev" id="btnPrev" onclick="cambiarPaso(-1)">← Anterior</button>
    <button class="btn btn-next" id="btnNext" onclick="cambiarPaso(1)">Siguiente →</button>
    <button class="btn btn-finish" id="btnFinish" onclick="mostrarFin()" hidden>¡Listo! ✓</button>
  </div>
</div>
 
<div class="footer" id="footerEl"></div>
 
<script>
 
const TAREA_CREA = 'PRACTICA 3-MiniCrud con Base de Datos';
 
const CONFIGS = [
 
  /* ── ACTIVIDAD 01 — Básico ── */
  {
    actividad: 'Actividad 01 — Mostrar la fecha de nacimiento',
    nivel: 'basico',
    descripcion: 'Agregar a la tabla <code>personas</code> la columna <code>fecha_nacimiento</code> (tipo DATE), cargar fechas <strong>directamente en MySQL</strong> y mostrarlas en el listado de la aplicación. El cambio recorre las capas que intervienen en una consulta: la tabla, el VO, el método <code>getLista()</code> del DAO y la vista <code>persona-lista.jsp</code>. En esta práctica el DAO solo se usa para traer datos; agregar, actualizar y eliminar desde la aplicación se trabajará en las próximas clases.',
    carpetaProyecto: 'mini-crud-sql-base',
    urlBase: 'http://localhost:8080/mini-crud/persona',
    zipPrefijo: 'Actividad1',
    zipEjemplo: 'Actividad1_GarciaMaria.zip',
    archivos: [
      { tipo: 'modificar', ruta: 'src/main/java/modelo/vo/',       nombre: 'PersonaVO.java' },
      { tipo: 'modificar', ruta: 'src/main/java/modelo/dao/',      nombre: 'PersonaDAO.java' },
      { tipo: 'modificar', ruta: 'src/main/webapp/WEB-INF/vista/', nombre: 'persona-lista.jsp' },
    ],
    verificacion: 'El listado debe mostrar la columna <strong>Fecha de nacimiento</strong> con los mismos valores que devuelve <code>SELECT * FROM personas</code> en MySQL Workbench. La persona que no tiene fecha cargada debe aparecer con la celda vacía, sin errores.',
    alertaDeploy: 'Los errores más comunes son: el nombre de la columna en <code>rs.getDate("fecha_nacimiento")</code> no coincide exactamente con el de la tabla (o no se ejecutó el <code>ALTER TABLE</code>), falta el getter <code>getFechaNacimiento()</code> en PersonaVO, o en el JSP se escribió <code>${p.fecha_nacimiento}</code> en lugar de <code>${p.fechaNacimiento}</code> (EL usa el nombre del getter, no el de la columna).',
    capturas: [
      { icono: '🗄️', titulo: 'Datos en MySQL',     desc: 'MySQL Workbench mostrando el resultado de <code>SELECT * FROM personas</code>, con la columna <code>fecha_nacimiento</code> y las fechas cargadas.' },
      { icono: '📋', titulo: 'Lista de personas', desc: 'El listado de la aplicación con la columna Fecha de nacimiento visible, incluida la persona sin fecha. La URL debe ser visible.' },
    ],
    archivosEntrega: [
      { nombre: 'Actividad1_ApellidoNombre.zip', desc: 'El proyecto completo comprimido' },
      { nombre: 'captura-mysql.png',             desc: 'Resultado del SELECT en MySQL Workbench' },
      { nombre: 'captura-lista.png',             desc: 'Lista con la columna Fecha de nacimiento' },
    ],
    notaEntrega: 'Verificar que la columna <code>fecha_nacimiento</code> existe en la tabla <code>personas</code> y tiene fechas cargadas antes de tomar las capturas.',
    preguntasOrientadoras: [
      '¿En qué tipo de dato de MySQL se puede guardar una fecha? ¿Y en Java, qué objeto se usa para representarla en el VO?',
      'Si la tabla <code>personas</code> ya existe con datos, ¿se puede agregar una columna sin perder esos registros? ¿Qué comando SQL lo hace?',
      'La consulta <code>SELECT * FROM personas</code> ya trae la columna nueva. ¿Por qué igual no aparece en la página hasta modificar el DAO? ¿En qué fase se lee?',
      '¿Por qué conviene <strong>agregar</strong> un constructor de 3 parámetros en <code>PersonaVO</code> en lugar de modificar el de 2? ¿Qué otras partes del proyecto usan el constructor actual?',
    ],
    tipo: 'act01',
  },
 
  /* ── ACTIVIDAD 02 — Intermedio ── */
  {
    actividad: 'Actividad 02 — Búsqueda por nombre',
    nivel: 'intermedio',
    descripcion: 'Agregar un método <code>buscarPorNombre</code> al DAO que traiga de la base solo las personas cuyo nombre contiene un texto, usando SQL <code>LIKE</code>, e integrarlo con una acción nueva en el Servlet y un formulario de búsqueda en <code>persona-lista.jsp</code>. Los datos de prueba se cargan directamente en MySQL.',
    carpetaProyecto: 'mini-crud-sql-base',
    urlBase: 'http://localhost:8080/mini-crud/persona',
    zipPrefijo: 'Actividad2',
    zipEjemplo: 'Actividad2_GarciaMaria.zip',
    archivos: [
      { tipo: 'modificar', ruta: 'src/main/java/modelo/dao/',      nombre: 'PersonaDAO.java' },
      { tipo: 'modificar', ruta: 'src/main/java/controlador/',     nombre: 'PersonaControladorServlet.java' },
      { tipo: 'modificar', ruta: 'src/main/webapp/WEB-INF/vista/', nombre: 'persona-lista.jsp' },
    ],
    verificacion: 'Buscar "an" debe mostrar solo Ana, Mariana y Fabiana. Si no hay coincidencias, debe aparecer el mensaje "No se encontraron personas con ese nombre." El enlace "Ver todos" debe volver al listado completo sin filtro.',
    alertaDeploy: 'Si la búsqueda no filtra y siempre muestra todos los resultados, verificar que el <code>case "buscar"</code> está en el <code>doGet</code> (no en el <code>doPost</code>), que el formulario tiene <code>method="get"</code> y que envía <code>action=buscar</code> en un campo oculto. Si hay error 500, revisar que el método <code>buscarPorNombre</code> está declarado en PersonaDAO y que el <code>%</code> se agrega en el valor del parámetro, no en el SQL.',
    capturas: [
      { icono: '🔍', titulo: 'Búsqueda con resultados', desc: 'La tabla mostrando solo las personas que coinciden con el término buscado. El campo de búsqueda debe tener texto escrito y la URL debe ser visible.' },
      { icono: '🚫', titulo: 'Sin resultados',           desc: 'La página mostrando el mensaje "No se encontraron personas con ese nombre." al buscar algo que no existe en la BD. La URL debe ser visible.' },
    ],
    archivosEntrega: [
      { nombre: 'Actividad2_ApellidoNombre.zip',  desc: 'El proyecto completo comprimido' },
      { nombre: 'captura-busqueda.png',            desc: 'Búsqueda con resultados filtrados visibles' },
      { nombre: 'captura-sin-resultados.png',      desc: 'Mensaje "No se encontraron personas con ese nombre."' },
    ],
    notaEntrega: 'Esta actividad se entrega sobre el mismo proyecto que la Actividad 01. El ZIP debe incluir todos los cambios acumulados (fecha_nacimiento + búsqueda por nombre).',
    preguntasOrientadoras: [
      '¿En qué capa de la arquitectura MVC (VO, DAO, Servlet o JSP) se escribe la consulta SQL con <code>LIKE</code>?',
      '¿Por qué el <code>%</code> se agrega en el valor que se pasa con <code>ps.setString()</code> y no directamente en el texto del SQL?',
      '¿Por qué el formulario de búsqueda debe usar <code>method="get"</code> en vez de <code>method="post"</code>?',
      '¿Qué debe mostrarse en la lista si ninguna persona coincide con el término buscado?',
    ],
    tipo: 'act02',
  },
 
  /* ── ACTIVIDAD 03 — Avanzado ── */
  {
    actividad: 'Actividad 03 — Llevar la entidad propia a MySQL',
    nivel: 'avanzado',
    descripcion: 'Retomar el proyecto de la <strong>Actividad 03 de la Práctica 2</strong> (el CRUD de la entidad elegida: Producto, Libro, Película, Videojuego, Estudiante u otra) y hacer que su <strong>listado salga de MySQL</strong> en lugar del <code>ArrayList</code> en memoria. Hay que crear la tabla, cargar los datos directamente en MySQL Workbench, conectar el proyecto a la base y escribir el método de listado con las 5 fases. Como por ahora el DAO solo trae datos, los botones Agregar, Editar y Eliminar quedan deshabilitados hasta las próximas clases. En esta guía se usa <strong>Producto</strong> como ejemplo: reemplazar por la entidad propia.',
    carpetaProyecto: 'el proyecto de la Actividad 03 de la Práctica 2',
    urlBase: 'http://localhost:8080/&lt;nombre-del-proyecto&gt;/producto',
    zipPrefijo: 'Actividad3',
    zipEjemplo: 'Actividad3_GarciaMaria.zip',
    archivos: [
      { tipo: 'modificar', ruta: '',                                nombre: 'pom.xml' },
      { tipo: 'crear',     ruta: 'src/main/resources/',             nombre: 'db.properties' },
      { tipo: 'crear',     ruta: 'src/main/java/modelo/conexion/',  nombre: 'Conexion.java' },

function renderArchivos(cfg) {
  return cfg.archivos.map(f =>

}
 
function renderCapturas(cfg) {
  const cards = cfg.capturas.map(c =>
    `<div class="cap-card">
       <div class="cap-icon">${c.icono}</div>
       <div class="cap-title">Captura — ${c.titulo}</div>
       <div class="cap-desc">${c.desc}</div>
     </div>`
  ).join('');

function renderTablaEntrega(cfg) {
  const filas = cfg.archivosEntrega.map((a, i) =>

    <tbody>${filas}</tbody>
  </table>`;
}

/* ── Motor de pasos ── */
function renderProgreso(pasos) {
  const dots = document.getElementById('progressDots');
  const label = document.getElementById('progressLabel');
  dots.innerHTML = '';
  pasos.forEach((_, i) => {
    if (i > 0) {
      const sep = document.createElement('div');
      sep.className = 'dot-sep' + (i <= pasoActual ? ' done' : '');
      dots.appendChild(sep);
    }
    const d = document.createElement('div');
    d.className = 'dot-step' + (i < pasoActual ? ' done' : i === pasoActual ? ' active' : '');
    d.textContent = pasos[i].esLectura ? '📖' : String(i);
    dots.appendChild(d);
  });
  label.innerHTML = `Paso <span>${pasoActual}</span> de <span>${pasos.length - 1}</span> — ${pasos[pasoActual].titulo}`;
}
 
function renderPaso() {
  const cfg = CONFIGS[actividadActual];
  const pasos = buildPasos(cfg);
  const paso = pasos[pasoActual];
  const container = document.getElementById('stepContainer');
 
  const badgeContent = paso.esLectura ? '📖' : String(pasoActual);
 
  container.innerHTML = `
    <div class="step-panel">
      <div class="card">
        <div class="step-badge">
          <div class="step-badge-num">${badgeContent}</div>
          <div class="step-badge-title">${paso.titulo}</div>
        </div>
        ${paso.html}
      </div>
    </div>`;
 
  /* sincronizar badge numérico */
  const badgeNum = document.querySelector('.step-badge-num');
  if (badgeNum && /^\d+$/.test(badgeNum.textContent.trim())) {
    badgeNum.textContent = pasoActual;
  }
 
  document.getElementById('btnPrev').hidden = pasoActual === 0;
  document.getElementById('btnNext').hidden = pasoActual === pasos.length - 1;
  document.getElementById('btnFinish').hidden = pasoActual !== pasos.length - 1;
  renderProgreso(pasos);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
 
function cambiarPaso(dir) {
  const pasos = buildPasos(CONFIGS[actividadActual]);
  const siguiente = pasoActual + dir;
  if (siguiente >= 0 && siguiente < pasos.length) {
    pasoActual = siguiente;
    renderPaso();
  }
}
 
function cambiarActividad(idx) {
  actividadActual = idx;
  pasoActual = 0;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });
  document.getElementById('footerEl').textContent =
    `Programación Avanzada · Bachillerato Tecnológico · UTU (DGETP)  ·  Guía de entrega — ${CONFIGS[idx].actividad}`;
  renderPaso();
}
 
function mostrarFin() {
  const haySiguiente = actividadActual < CONFIGS.length - 1;
  if (haySiguiente) {
    cambiarActividad(actividadActual + 1);
    return;
  }
  /* Solo Act03 (última) muestra la pantalla de completado */
  const container = document.getElementById('stepContainer');
  container.innerHTML = `
    <div class="step-panel">
      <div class="card complete-card">
        <div class="complete-icon">✅</div>
        <h2>Práctico <span>completado</span></h2>
        <p>Las tres actividades fueron entregadas en CREA. La docente puede revisar los proyectos y verificar que funcionan correctamente.</p>
        <button class="btn-restart" onclick="cambiarActividad(0)" style="margin-top:14px;">↺ Ver desde el principio</button>
      </div>
    </div>`;
  document.getElementById('btnPrev').hidden = true;
  document.getElementById('btnNext').hidden = true;
  document.getElementById('btnFinish').hidden = true;
  const dots = document.getElementById('progressDots');
  dots.querySelectorAll('.dot-step').forEach(d => { d.classList.remove('active'); d.classList.add('done'); });
  dots.querySelectorAll('.dot-sep').forEach(d => d.classList.add('done'));
  document.getElementById('progressLabel').innerHTML = `<span>¡Todos los pasos completados!</span>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}
 
function reiniciar() { pasoActual = 0; renderPaso(); }
 
/* Iniciar */
cambiarActividad(0);
 
</script>
</body>
